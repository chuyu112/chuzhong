limit_req_zone $binary_remote_addr zone=zhixu_login:1m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name chuzhong.jadecircle.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://chuzhong.jadecircle.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuzhong.jadecircle.cn;
    ssl_certificate /etc/letsencrypt/live/chuzhong.jadecircle.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chuzhong.jadecircle.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 45m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/api/auth/(login|register|password)$ {
        limit_req zone=zhixu_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3018;
    }
    location / { proxy_pass http://127.0.0.1:3018; }
}
